name: build

# Runs the whole platform on every push: generate the data, run all 18 notebooks with Spark,
# check the semantic model, and prove that the quality gate stops bad data.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: pip install pyspark==3.5.3 nbformat

      - name: Generate fictional data
        run: python generator/generate.py

      - name: Run all notebooks (bronze, silver with quality gate, gold) for six domains
        run: python tools/runlocal.py

      - name: Check the semantic model
        run: python -c "import sys; sys.path.insert(0, 'fabric'); import buildmodel; buildmodel.check(); print('model ok')"

      - name: Quality gate stops bad data
        run: python tools/gatetest.py
